<?xml version="1.0" encoding="UTF-8"?>
<!-- Credalia brand mark — on-dark variant: navy diamond rendered white so the
     mark stays visible on navy surfaces (e.g. apply modal sidebar). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mask for Green: subtracts Orange diamond + gap -->
    <mask id="light-green-mask">
      <rect width="512" height="512" fill="white" />
      <g transform="translate(230, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="black" stroke="black" stroke-width="32" stroke-linejoin="round" />
      </g>
    </mask>

    <!-- Mask for Orange: subtracts White diamond + gap -->
    <mask id="light-orange-mask">
      <rect width="512" height="512" fill="white" />
      <g transform="translate(326, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="black" stroke="black" stroke-width="32" stroke-linejoin="round" />
      </g>
    </mask>
  </defs>

  <g transform="translate(18, 0)">
    <!-- Green Chevron (Left) -->
    <g mask="url(#light-green-mask)">
      <g transform="translate(134, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#387758" />
      </g>
    </g>

    <!-- Orange Chevron (Middle) -->
    <g mask="url(#light-orange-mask)">
      <g transform="translate(230, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#dd6a44" />
      </g>
    </g>

    <!-- White Diamond (Right) — navy in the standard mark, white for dark surfaces -->
    <g transform="translate(326, 256) rotate(45)">
      <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#ffffff" />
    </g>
  </g>
</svg>
