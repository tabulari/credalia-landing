<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mask for Green: subtracts Orange diamond + gap -->
    <mask id="logo-green-mask">
      <rect width="512" height="512" fill="white" />
      <g transform="translate(230, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="black" stroke="black" stroke-width="32" stroke-linejoin="round" />
      </g>
    </mask>

    <!-- Mask for Orange: subtracts Navy diamond + gap -->
    <mask id="logo-orange-mask">
      <rect width="512" height="512" fill="white" />
      <g transform="translate(326, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="black" stroke="black" stroke-width="32" stroke-linejoin="round" />
      </g>
    </mask>
  </defs>

  <g transform="translate(18, 0)">
    <!-- Green Chevron (Left) -->
    <g mask="url(#logo-green-mask)">
      <g transform="translate(134, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#387758" />
      </g>
    </g>

    <!-- Orange Chevron (Middle) -->
    <g mask="url(#logo-orange-mask)">
      <g transform="translate(230, 256) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#dd6a44" />
      </g>
    </g>

    <!-- Navy Diamond (Right) -->
    <g transform="translate(326, 256) rotate(45)">
      <rect x="-100" y="-100" width="200" height="200" rx="44" fill="#0d2c51" />
    </g>
  </g>
</svg>
